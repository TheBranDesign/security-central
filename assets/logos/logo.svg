<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <!-- Shield & Monogram Emblem -->
  <g transform="translate(4, 5)">
    <!-- Outer Shield Gradient -->
    <defs>
      <linearGradient id="scShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0284c7" />
        <stop offset="50%" stop-color="#0369a1" />
        <stop offset="100%" stop-color="#0c4a6e" />
      </linearGradient>
      <linearGradient id="scGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8" />
        <stop offset="100%" stop-color="#0284c7" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.3"/>
      </filter>
    </defs>
    <!-- Background Shield -->
    <path d="M30 4 L54 13 V34 C54 48 43 56 30 60 C17 56 6 48 6 34 V13 L30 4 Z" 
          fill="url(#scShieldGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Inner Contour -->
    <path d="M30 9 L49 17 V33 C49 44 40 51 30 54 C20 51 11 44 11 33 V17 L30 9 Z" 
          fill="#081b33" opacity="0.85"/>
    <!-- Stylized S and C Monogram -->
    <path d="M36 21 C36 21 26 21 24 25 C22 29 28 31 32 33 C36 35 38 38 36 42 C34 46 25 46 22 43" 
          stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M37 28 C41 29 43 32 43 35 C43 40 39 44 34 45" 
          stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Central Pulse Dot -->
    <circle cx="30" cy="32" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Typography -->
  <text x="76" y="33" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="21" font-weight="800" fill="#ffffff" letter-spacing="0.5">SECURITY</text>
  <text x="186" y="33" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="21" font-weight="400" fill="#38bdf8" letter-spacing="1">CENTRAL</text>
  <text x="76" y="49" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8" font-weight="700" fill="#94a3b8" letter-spacing="2">WHOLESALE ALARM MONITORING • EST. 1963</text>
</svg>
